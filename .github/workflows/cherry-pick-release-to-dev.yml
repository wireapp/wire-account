# This job will automatically create a cherry pick PR from any release/* branch to the dev branch
# It allows the dev branch to stay up-to-date with fixes made to specific release branches
name: Cherry pick to dev
on:
  push:
    branches:
      - release/*
# contents: write is for the push of the cherry-pick branch (checkout persists the
# job token); the pull request itself is opened with the OTTO_THE_BOT_GH_TOKEN secret.
permissions:
  contents: write

jobs:
  cherry_pick:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create PR to branch
        uses: gorillio/github-action-cherry-pick@master
        with:
          pr_branch: 'dev'
        env:
          GITHUB_TOKEN: ${{ secrets.OTTO_THE_BOT_GH_TOKEN }}
