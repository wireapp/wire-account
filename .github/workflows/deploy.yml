name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - wire-account-staging-node22
          - wire-account-prod-node22
      release_version:
        description: 'Explicit release version to deploy (X.Y.Z or X.Y.Z-<channel>.N). Required to deploy a draft candidate, which has no tag ref. Leave empty to build from source, unless dispatched against a release tag.'
        type: string
        required: false
      confirm_prod:
        description: 'Must be true to allow a production deploy'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── 1. RESOLVE DEPLOY MODE ───────────────────────────────────────────────────
  # A prepared or published release is deployed by consuming its artifacts, not
  # by rebuilding source. Resolution order: explicit release_version input (the
  # only way to reach a draft candidate, which has no tag ref) → dispatch ref
  # matching a release tag → otherwise build from source.
  resolve-mode:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve deploy mode
        id: resolve
        env:
          # Free-text dispatch input — passed through the environment so it
          # cannot be interpolated into the script as shell code.
          RELEASE_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Tolerate an operator typing either "2.12.0" or "v2.12.0".
          release_version="${RELEASE_VERSION#v}"
          ref_name="$REF_NAME"

          if [[ -n "$release_version" && ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[1-9][0-9]*|[0-9]+))?$ ]]; then
            echo "error: release_version '$release_version' is not a valid release version (X.Y.Z or X.Y.Z-<channel>.N)" >&2
            exit 1
          fi

          if [[ -n "$release_version" ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=$release_version" >> "$GITHUB_OUTPUT"
            echo "Deploy mode: release (explicit release_version=$release_version)"
          elif [[ "$ref_name" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[1-9][0-9]*|[0-9]+))?)$ ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Deploy mode: release (dispatched against tag $ref_name)"
          else
            echo "mode=source" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Deploy mode: source"
          fi

  # ── 2. BUILD FROM SOURCE (source mode only) ─────────────────────────────────
  build:
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'source'
    uses: ./.github/workflows/build.yml
    with:
      retention_days: 7
    secrets:
      OTTO_THE_BOT_GH_TOKEN: ${{ secrets.OTTO_THE_BOT_GH_TOKEN }}

  # ── 3. FETCH RELEASE ARTIFACTS (release mode only) ──────────────────────────
  # Publication never rebuilds; deployment of a release must not either. The
  # exact bundle attached to the release is downloaded and verified against its
  # release manifest, then re-uploaded under the same artifact name the source
  # build path uses, so the deploy job below is unaffected by which mode ran.
  fetch-release:
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # `contents: write` (push access) is required to *list* draft releases —
      # the releases API only returns drafts to users with push access, and
      # deploying a draft candidate is the whole point of release mode. This
      # job only ever reads.
      contents: write
    steps:
      - name: Download and verify release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-mode.outputs.version }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          version="$VERSION"
          tag="v${version}"

          matches=$(gh api --paginate "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$tag\")" | jq -s '.')
          count=$(jq 'length' <<<"$matches")
          if [[ "$count" -ne 1 ]]; then
            echo "error: expected exactly one release for tag $tag, found $count" >&2
            exit 1
          fi

          release_id=$(jq -r '.[0].id' <<<"$matches")
          is_draft=$(jq -r '.[0].draft' <<<"$matches")

          if [[ "$is_draft" == "true" && "$TARGET_ENV" == "wire-account-prod-node22" ]]; then
            echo "error: release $tag is still a draft — a draft release may only be deployed to non-production environments" >&2
            exit 1
          fi

          assets=$(gh api "repos/${{ github.repository }}/releases/${release_id}/assets")

          download_asset() {
            local name="$1" out="$2" asset_id
            asset_id=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<<"$assets")
            if [[ -z "$asset_id" ]]; then
              echo "error: asset '$name' not found on release $tag" >&2
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/${asset_id}" > "$out"
          }

          download_asset "release-manifest.json" ./release-manifest.json
          download_asset "wire-account.zip" ./wire-account.zip

          # `artifacts[type=bundle]` of a manifest from release-manifest, `.bundle` of an earlier one.
          expected_sha256=$(jq -r '[.artifacts[]? | select(.type == "bundle") | .sha256][0] // .bundle.sha256 // empty' ./release-manifest.json)
          actual_sha256=$(sha256sum ./wire-account.zip | awk '{print $1}')
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "error: downloaded bundle sha256 $actual_sha256 does not match manifest $expected_sha256" >&2
            exit 1
          fi
          echo "Verified wire-account.zip for $tag (sha256 $actual_sha256)"

      - name: Upload verified bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wire-account-zip
          path: wire-account.zip
          retention-days: 1

  # ── 4. DEPLOY ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: [resolve-mode, build, fetch-release]
    # Tolerate whichever of build/fetch-release was skipped by mode, and
    # require explicit confirmation before touching production. The leading
    # `!` must sit inside ${{ }} — unquoted, it is an invalid YAML tag indicator.
    if: >-
      ${{ !cancelled() && needs.resolve-mode.result == 'success' && needs.build.result != 'failure' && needs.fetch-release.result != 'failure' && (inputs.environment != 'wire-account-prod-node22' || inputs.confirm_prod == true) }}

    permissions:
      contents: read
    uses: ./.github/workflows/eb-deploy.yml
    with:
      environment_name: ${{ inputs.environment }}
      # Exactly one of the two version outputs is set — resolve-mode's in release mode,
      # the build job's in source mode, the other job having been skipped.
      version_label: ${{ needs.resolve-mode.outputs.version || needs.build.outputs.version }}-${{ github.run_id }}
      version_description: ${{ github.sha }}
    secrets:
      WEBTEAM_AWS_ACCESS_KEY_ID: ${{ secrets.WEBTEAM_AWS_ACCESS_KEY_ID }}
      WEBTEAM_AWS_SECRET_ACCESS_KEY: ${{ secrets.WEBTEAM_AWS_SECRET_ACCESS_KEY }}
