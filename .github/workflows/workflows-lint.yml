name: Workflows lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - '.github/lint/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflows-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          echo "${RUNNER_TEMP}/actionlint" >> "$GITHUB_PATH"

      - name: actionlint
        run: |
          set -euo pipefail
          actionlint -version
          actionlint -color .github/workflows/pr.yml .github/workflows/workflows-lint.yml

      - name: Install zizmor
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/zizmor"
          "${RUNNER_TEMP}/zizmor/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes --no-deps -r .github/lint/zizmor-requirements.txt
          echo "${RUNNER_TEMP}/zizmor/bin" >> "$GITHUB_PATH"

      - name: zizmor
        run: |
          set -euo pipefail
          zizmor --version
          zizmor --offline --format github --min-severity medium --min-confidence medium .github/workflows/pr.yml .github/workflows/workflows-lint.yml
          echo "--- every finding, for information (does not fail the job):"
          zizmor --offline --format plain --no-exit-codes .github/workflows
