name: Elastic Beanstalk deploy

# Deploys the bundle of the `wire-account-zip` artifact of the calling
# run to one Elastic Beanstalk environment of the `Account` application. Called
# by `deploy.yml` (any environment) and `publish-release.yml` (staging, after a
# dev-sourced release): one place for the deployment.
#
# The caller uploads the artifact (`build.yml`, `deploy.yml` for a release, or
# the publish job) and passes the AWS keys explicitly, never `secrets: inherit`.
# The rollout is not waited on, only the recovery of the environment.

on:
  workflow_call:
    inputs:
      environment_name:
        description: 'Elastic Beanstalk environment, e.g. wire-account-staging-node22'
        type: string
        required: true
      version_label:
        description: 'Application version label. Every environment deploys into the same application, so the label identifies a version in one shared list: callers add the run id to keep it unique (EB rejects duplicates) and to link the version back to its run'
        type: string
        required: true
      version_description:
        description: 'Application version description'
        type: string
        required: true
    secrets:
      WEBTEAM_AWS_ACCESS_KEY_ID:
        description: 'Access key of the Elastic Beanstalk deployer'
        required: true
      WEBTEAM_AWS_SECRET_ACCESS_KEY:
        description: 'Secret key of the Elastic Beanstalk deployer'
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment_name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wire-account-zip
          path: .

      - name: Deploy to Elastic Beanstalk
        id: deploy
        uses: einaregilsson/beanstalk-deploy@a67044fa332b06e68985b06d361934c28ab09007 # v23
        with:
          application_name: Account
          aws_access_key: ${{ secrets.WEBTEAM_AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.WEBTEAM_AWS_SECRET_ACCESS_KEY }}
          deployment_package: wire-account.zip
          environment_name: ${{ inputs.environment_name }}
          region: eu-central-1
          use_existing_version_if_available: true
          version_description: ${{ inputs.version_description }}
          version_label: ${{ inputs.version_label }}
          wait_for_deployment: false
          wait_for_environment_recovery: 150

      # `!cancelled()`: the outcome is worth recording whichever way it went.
      - name: Report the deployment
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          ENVIRONMENT: ${{ inputs.environment_name }}
          VERSION_LABEL: ${{ inputs.version_label }}
        run: |
          set -euo pipefail
          {
            echo
            if [[ "$OUTCOME" == "success" ]]; then
              echo "> :rocket: \`${VERSION_LABEL}\` was deployed to \`${ENVIRONMENT}\`. The rollout is not waited on — check the environment's health in the AWS console."
            else
              echo "> :warning: Deployment of \`${VERSION_LABEL}\` to \`${ENVIRONMENT}\` **${OUTCOME}**. Re-run this job, or use the \`Deploy\` workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
