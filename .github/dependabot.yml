version: 2

# Every ecosystem below declares a `cooldown`: Dependabot will not propose a
# release younger than that many days. It closes a supply-chain window — a
# compromised or typosquatted version would otherwise reach a PR within
# minutes of publication, wearing the trusted Dependabot badge, and is easy to
# wave through as routine.
#
# This costs nothing in vulnerability response: per GitHub's documentation the
# cooldown applies to *version* updates only, never to *security* updates, so
# advisories are still surfaced immediately.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: sunday
      time: '02:00'
      timezone: 'Europe/Berlin'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
    labels:
      - 'type: chore 🧹'
    ignore:
      - dependency-name: husky
        versions:
          - '>= 5.a'
      # Babel major versions must be upgraded together with their presets,
      # plugins, loader, and configuration.
      - dependency-name: '@babel/*'
        update-types:
          - 'version-update:semver-major'
    groups:
      major-updates:
        update-types:
          - major
  - package-ecosystem: npm
    directory: '/server'
    schedule:
      interval: weekly
      day: sunday
      time: '02:00'
      timezone: 'Europe/Berlin'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
    labels:
      - 'type: chore 🧹'
    ignore:
      - dependency-name: '@babel/*'
        update-types:
          - 'version-update:semver-major'
    groups:
      major-updates:
        update-types:
          - major
  - package-ecosystem: npm
    directory: '/app-config'
    schedule:
      interval: daily
      time: '02:00'
      timezone: 'Europe/Berlin'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
    labels:
      - 'type: chore 🧹'
    groups:
      major-updates:
        update-types:
          - major

  # Github actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
    groups:
      major-updates:
        update-types:
          - major
