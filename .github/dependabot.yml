version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: sunday
      time: '02:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 99
    labels:
      - 'type: chore 🧹'
    ignore:
      - dependency-name: husky
        versions:
          - '>= 5.a'
      # Babel major versions must be upgraded together with their presets,
      # plugins, loader, and configuration.
      - dependency-name: '@babel/*'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: npm
    directory: '/server'
    schedule:
      interval: weekly
      day: sunday
      time: '02:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 99
    labels:
      - 'type: chore 🧹'
    ignore:
      - dependency-name: '@babel/*'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: npm
    directory: '/app-config'
    schedule:
      interval: daily
      time: '02:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 99
    labels:
      - 'type: chore 🧹'

  # Github actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    open-pull-requests-limit: 99
    schedule:
      interval: 'daily'
